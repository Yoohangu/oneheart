<script>
  const CHANNEL_ID = 'UC0ybLv4exTjqrjjqCxVifPQ'; // 한마음교회 유튜브 채널
  const RSS_URL = `https://www.youtube.com/feeds/videos.xml?channel_id=${CHANNEL_ID}`;
  const RSS2JSON_URL = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(RSS_URL)}`;

  async function fetchLatestVideo(timeoutMs) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    try {
      const res = await fetch(RSS2JSON_URL, { signal: controller.signal });
      const data = await res.json();
      const latest = data.items && data.items[0];
      if (!latest) throw new Error('no items from rss2json');
      return latest;
    } finally {
      clearTimeout(timer);
    }
  }

  (async () => {
    let latest;
    try {
      latest = await fetchLatestVideo(6000);
    } catch (e1) {
      try {
        latest = await fetchLatestVideo(6000); // 일시적 오류 대비 1회 재시도
      } catch (e2) {
        console.warn('최신 설교 영상을 불러오지 못해 기본값을 표시합니다.', e2);
        return;
      }
    }

    const rawTitle = latest.title.replace(/&quot;/g, '"').replace(/&amp;/g, '&');
    const quoted = rawTitle.match(/"([^"]+)"/);
    const sermonTitle = quoted ? quoted[1] : rawTitle;

    const parens = [...rawTitle.matchAll(/\(([^)]+)\)/g)].map(m => m[1]);
    const passage = parens.find(p => /[장절]/.test(p)) || '';

    const preacherMatch = rawTitle.match(/([가-힣]{2,10}\s*(?:담임)?목사)\s*$/);
    const preacher = preacherMatch ? preacherMatch[1] : '';

    document.getElementById('videoLink').href = latest.link;
    document.getElementById('videoThumb').src = latest.thumbnail;
    document.getElementById('videoTitle').textContent = `주일예배 설교: "${sermonTitle}"`;
    document.getElementById('videoSub').textContent = [preacher, passage].filter(Boolean).join(' · ');
  })();

  const copyAddrBtn = document.getElementById('copyAddrBtn');
  copyAddrBtn.addEventListener('click', async () => {
    const address = '서울특별시 강동구 성안로 3길 127 한마음교회';
    try {
      await navigator.clipboard.writeText(address);
      const original = copyAddrBtn.textContent;
      copyAddrBtn.textContent = '복사됨';
      setTimeout(() => { copyAddrBtn.textContent = original; }, 1500);
    } catch (error) {
      console.warn('주소 복사에 실패했습니다.', error);
    }
  });

  const contactButton = document.querySelector('.cta');
  const contactVCard = [
    'BEGIN:VCARD',
    'VERSION:3.0',
    'N:유한구;;;',
    'FN:유한구',
    'ORG:한마음교회',
    'TITLE:담임목사',
    'TEL;TYPE=CELL:010-7470-9338',
    'URL:https://yoohangu.github.io/oneheart/',
    'END:VCARD'
  ].join('\r\n');

  contactButton.addEventListener('click', async () => {
    const filename = '유한구-한마음교회-연락처.vcf';
    const blob = new Blob([contactVCard], { type: 'text/vcard;charset=utf-8' });
    const downloadUrl = URL.createObjectURL(blob);
    const downloadLink = document.createElement('a');
    downloadLink.href = downloadUrl;
    downloadLink.download = filename;
    downloadLink.click();
    setTimeout(() => URL.revokeObjectURL(downloadUrl), 1000);

    if (navigator.share && navigator.canShare) {
      const shareFile = new File([blob], filename, { type: 'text/vcard' });
      if (navigator.canShare({ files: [shareFile] })) {
        try {
          await navigator.share({
            files: [shareFile],
            title: '유한구 · 한마음교회 담임목사',
            text: '한마음교회 유한구 목사 연락처'
          });
        } catch (error) {
          if (error.name !== 'AbortError') console.warn('연락처 공유를 완료하지 못했습니다.', error);
        }
      }
    }
  });
</script>

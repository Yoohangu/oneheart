<style>
  :root{
    --p-blue-main:#2F73F2; --p-blue-main-rgb:47,115,242;
    --p-blue-deep:#1F5FD9; --p-blue-deep-rgb:31,95,217;
    --p-blue-light:#6FA7FF; --p-blue-light-rgb:111,167,255;
    --p-bg-white:#FFFFFF; --p-bg-gray-light:#F5F7FA; --p-bg-blue-pale:#EAF3FF; --p-bg-blue-panel:#DDEEFF;
    --p-ink-900:#101A3D; --p-ink-700:#3A4568; --p-ink-500:#5C6A93;
    --primary-blue:var(--p-blue-main); --primary-blue-deep:var(--p-blue-deep); --primary-blue-light:var(--p-blue-light);
    --primary-blue-rgb:var(--p-blue-main-rgb); --primary-blue-deep-rgb:var(--p-blue-deep-rgb);
    --bg-page:var(--p-bg-blue-pale); --bg-surface:var(--p-bg-white); --bg-surface-muted:var(--p-bg-gray-light); --bg-panel:var(--p-bg-blue-panel);
    --ink:var(--p-ink-900); --ink-secondary:var(--p-ink-700); --ink-tertiary:var(--p-ink-500); --ink-on-blue:var(--p-bg-white);
    --shadow-frame:0 30px 60px -26px rgba(var(--primary-blue-deep-rgb),.35);
    --shadow-cta:0 14px 26px -12px rgba(var(--primary-blue-rgb),.5);
    --shadow-soft:0 18px 30px rgba(var(--primary-blue-deep-rgb),.28);
    --shadow-orb-inset: inset -5px -7px 12px rgba(var(--primary-blue-deep-rgb),.30), inset 3px 4px 7px rgba(255,255,255,.95), 0 12px 20px -8px rgba(var(--primary-blue-rgb),.5);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; min-height:100%; font-family:'Pretendard',-apple-system,sans-serif;
    background:linear-gradient(180deg,var(--bg-panel) 0%,var(--bg-page) 45%,var(--bg-surface) 100%);
    display:flex; justify-content:center; padding:56px 20px 70px; overflow-x:hidden;
  }

  .page{ width:100%; max-width:420px; position:relative; }

  .cloud{ position:fixed; z-index:-1; opacity:.8; filter:blur(.3px); }
  .cloud svg{ display:block; }
  .c1{ top:6%; left:-6%; width:180px; animation:cdrift 26s ease-in-out infinite; }
  .c2{ top:16%; right:-8%; width:150px; animation:cdrift 30s ease-in-out infinite reverse; }
  .c3{ bottom:10%; left:-4%; width:130px; animation:cdrift 22s ease-in-out infinite; }
  @keyframes cdrift{ 0%,100%{transform:translateX(0)} 50%{transform:translateX(18px)} }
  @media (prefers-reduced-motion: reduce){ .cloud{animation:none} }

  .frame{
    border-radius:32px; padding:3px;
    background-image:linear-gradient(135deg, #FF9AD8, #FFD98C, #8CC7FF, #18DDEB, #B98CFF);
    box-shadow:0 30px 60px -26px rgba(31,95,217,.35);
  }
  .card{ background:var(--bg-surface); border-radius:29px; padding:38px 28px 28px; text-align:center; position:relative; overflow:hidden; }

  .photo-wrap{ display:flex; justify-content:center; margin:18px 0 10px; position:relative; }
  .photo-glow{
    position:absolute; top:-6%; width:230px; height:230px; border-radius:50%;
    background:radial-gradient(circle, rgba(255,246,214,.9), rgba(255,246,214,.25) 55%, transparent 75%);
    filter:blur(2px); z-index:0;
  }
  .photo{ position:relative; z-index:1; width:180px; height:180px; object-fit:cover; border-radius:50%;
    border:4px solid var(--bg-surface);
    filter:drop-shadow(var(--shadow-soft)); }

  h1{ margin:14px 0 0; font-size:26px; font-weight:800; letter-spacing:-.01em; color:var(--ink); }
  .role{ margin:7px 0 0; font-size:14.5px; font-weight:600; color:var(--primary-blue-deep); }
  .tagline{ margin:14px 0 0; font-size:13.5px; line-height:1.7; color:var(--ink-tertiary); }

  .rule{ height:1px; background:var(--bg-panel); margin:24px 0 20px; }

  .quick{ display:flex; gap:12px; justify-content:center; }
  .quick .item{ display:flex; flex-direction:column; align-items:center; gap:8px; }
  .quick a{ text-decoration:none; }
  .quick .lb{ font-size:11.5px; font-weight:700; color:var(--ink); }
  .orb{ position:relative; width:56px; height:56px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 30% 26%, var(--bg-surface), var(--bg-page) 42%, var(--primary-blue-light) 76%, var(--primary-blue) 100%);
    box-shadow: var(--shadow-orb-inset);
    transition:transform .16s ease;
  }
  .orb::after{ content:""; position:absolute; top:14%; left:22%; width:32%; height:22%; border-radius:50%; background:rgba(255,255,255,.85); filter:blur(2.5px); }
  .orb svg{ position:relative; z-index:1; width:24px; height:24px; }
  .item a:hover .orb{ transform:translateY(-3px); }
  .item a:focus-visible .orb{ outline:2px solid var(--primary-blue); outline-offset:2px; }

  .addr{ margin-top:20px; font-size:12.5px; line-height:1.7; color:var(--ink-tertiary); }
  .addr p{ margin:0; }

  .cta{
    display:flex; align-items:center; justify-content:center; gap:8px; width:100%; margin-top:26px;
    padding:16px 18px; border:none; cursor:pointer; border-radius:16px;
    font-family:inherit; font-size:15px; font-weight:700; color:var(--ink-on-blue);
    background:linear-gradient(135deg,var(--primary-blue),var(--primary-blue-deep)); box-shadow:var(--shadow-cta);
  }
  .cta:hover{ transform:translateY(-2px); }
  .logo{ margin-top:22px; max-width:220px; width:100%; height:auto; }
</style>

<script>
  const contactButton = document.querySelector('.cta');
  const contactVCard = [
    'BEGIN:VCARD',
    'VERSION:3.0',
    'N:유한구;;;',
    'FN:유한구',
    'ORG:한마음교회',
    'TITLE:담임목사',
    'TEL;TYPE=CELL:010-7470-9338',
    'URL:https://yoohangu.github.io/oneheart/',
    'END:VCARD'
  ].join('\r\n');

  contactButton.addEventListener('click', async () => {
    const filename = '유한구-한마음교회-연락처.vcf';
    const blob = new Blob([contactVCard], { type: 'text/vcard;charset=utf-8' });
    const downloadUrl = URL.createObjectURL(blob);
    const downloadLink = document.createElement('a');
    downloadLink.href = downloadUrl;
    downloadLink.download = filename;
    downloadLink.click();
    setTimeout(() => URL.revokeObjectURL(downloadUrl), 1000);

    if (navigator.share && navigator.canShare) {
      const shareFile = new File([blob], filename, { type: 'text/vcard' });
      if (navigator.canShare({ files: [shareFile] })) {
        try {
          await navigator.share({
            files: [shareFile],
            title: '유한구 · 한마음교회 담임목사',
            text: '한마음교회 유한구 목사 연락처'
          });
        } catch (error) {
          if (error.name !== 'AbortError') console.warn('연락처 공유를 완료하지 못했습니다.', error);
        }
      }
    }
  });
</script>
